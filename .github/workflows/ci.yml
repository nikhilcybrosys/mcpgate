name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Demo must fail (drift)
        run: |
          set +e
          npm run demo
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "demo unexpectedly passed"
            exit 1
          fi
          echo "demo exited $code as expected"
